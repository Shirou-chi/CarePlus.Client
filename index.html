<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/clinic-logo.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="CarePlus patient portal" />
        <meta name="theme-color" content="#0e7a86" />

        <script>
            // Apply the saved theme before React and the stylesheet render to avoid a light-mode flash.
            const savedTheme = localStorage.getItem("ui-theme");
            const isDarkTheme = savedTheme === "dark";
            document.documentElement.classList.toggle("dark-mode", isDarkTheme);
            document.documentElement.dataset.theme = isDarkTheme ? "dark" : "light";

            const savedTextSize = localStorage.getItem("ui-text-size");
            document.documentElement.dataset.textSize = savedTextSize === "large" || savedTextSize === "larger" ? "large" : "normal";
        </script>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet" />

        <title>CarePlus</title>
    </head>

    <body class="size-full bg-primary antialiased">
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
